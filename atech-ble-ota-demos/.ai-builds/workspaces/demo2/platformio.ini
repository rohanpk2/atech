[env]
build_cache_dir = /Users/rohan/Projects/atech/atech-ble-ota-demos/.ai-builds/cache
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags = -DBOARD_HAS_PSRAM
lib_extra_dirs = /Users/rohan/Projects/atech/atech-ble-ota-demos/shared
lib_deps =
  adafruit/Adafruit NeoPixel @ 1.15.5
  ; BLEOTA v1.0.6 is not currently in PlatformIO's registry; pin its tag commit.
  https://github.com/gb88/BLEOTA.git#2a0b11c5b248718c494fe1c86c967e7c343ab9b4

[env:base]
build_flags = ${env.build_flags} -DDEMO_VERSION=1

[env:updated]
build_flags = ${env.build_flags} -DDEMO_VERSION=2

; AI firmware builder target. The backend compiles this environment inside an
; isolated workspace copy of the project; it is never uploaded over USB.
[env:ai]
build_flags = ${env.build_flags} -DDEMO_VERSION=3 -DATECH_AI_BUILD=1
