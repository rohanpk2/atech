[env]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; ESP32-S3-WROOM-1 N16R8: 16 MB quad-SPI flash, 8 MB octal PSRAM (memory_type qio_opi selects the
; matching precompiled Arduino libraries; BOARD_HAS_PSRAM enables the PSRAM allocator).
board_build.flash_mode = qio
; One OTA slot (partitions.csv): the size check in shared/tools/check_ota_size.py fails the build
; when firmware.bin would not fit with a 64 KiB margin.
board_upload.maximum_size = 6291456
extra_scripts = post:../shared/tools/check_ota_size.py
lib_extra_dirs = ../shared
build_flags =
  -DBOARD_HAS_PSRAM
lib_deps =
  adafruit/Adafruit NeoPixel @ 1.15.5

[env:base]
build_flags = ${env.build_flags} -DDEMO_VERSION=1

[env:updated]
build_flags = ${env.build_flags} -DDEMO_VERSION=2

; AI firmware builder target. The backend compiles this environment inside an
; isolated workspace copy of the project; it is never uploaded over USB.
[env:ai]
build_flags = ${env.build_flags} -DDEMO_VERSION=3 -DATECH_AI_BUILD=1
